[project]
name = "mail-agent"
version = "0.1.0"
description = "Supervisor-based multi-agent mail triage & reply drafting"
requires-python = ">=3.11"
dependencies = [
  "langgraph",
  "langchain-anthropic",
  "langsmith",
  "pydantic>=2",
  "pydantic-settings",
  "fastapi",
  "uvicorn",
  "mcp",
  "google-api-python-client",
  "google-auth-oauthlib",
  "pyyaml",
  "langchain-openai>=1.7.2",
  "langchain>=1.4.7",
  "langgraph-checkpoint-sqlite>=3.1.2",
  "pandas>=3.1.0",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mail_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
